name: Bug report
description: Report an installation, sign-in or playback problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `redwax doctor`
      description: >
        Paste the diagnostic output. If installation failed before redwax
        could run, paste the installer error instead. Review it first and
        remove cookies, tokens, account identifiers and private paths.
      render: text
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and distribution
      placeholder: Ghostty on Fedora 44
    validations:
      required: true
