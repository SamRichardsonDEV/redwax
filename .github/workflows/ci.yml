name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning is a failure, so it fails here rather than in review.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.98", stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv python3-venv
          scripts/install_resolver.sh
          echo "$HOME/.local/share/redwax/yt-dlp/bin" >> "$GITHUB_PATH"

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No test reaches the network or needs an account, which is what makes
      # this job meaningful on a runner.
      - name: Tests
        run: cargo test --workspace

      - name: Clean-home setup
        run: |
          cargo build --locked -p redwax --bin redwax
          python3 scripts/smoke_install.py target/debug/redwax

      - name: Docs
        run: cargo doc --workspace --no-deps

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No account is named in a fixture
        run: ./scripts/check_fixtures.py

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Privacy guard regressions
        run: python3 -m unittest discover -s scripts/tests

      - name: Index and all reachable history contain no detected private data
        run: python3 scripts/check_private.py --history
