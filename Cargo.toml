[workspace]
resolver = "3"
members = [
    "crates/auth",
    "crates/ytm",
    "crates/resolve",
    "crates/player",
    "crates/marks",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/SamRichardsonDEV/redwax"

[workspace.dependencies]
redwax-auth = { path = "crates/auth" }
redwax-ytm = { path = "crates/ytm" }
redwax-resolve = { path = "crates/resolve" }
redwax-player = { path = "crates/player" }
redwax-marks = { path = "crates/marks" }

base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mpris-server = { version = "0.10", features = ["tokio"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs"] }
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
